<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Form validation</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --panel: Canvas;
        --panel2: Canvas;
        --text: CanvasText;
        --muted: GrayText;
        --line: color-mix(in srgb, CanvasText 20%, transparent);
        --accent: CanvasText;
        --ink: Canvas;
        --good: CanvasText;
        --danger: CanvasText;
        --shadow: none;
        --r: 0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: Canvas;
          --panel: Canvas;
          --panel2: Canvas;
          --text: CanvasText;
          --muted: GrayText;
          --line: color-mix(in srgb, CanvasText 20%, transparent);
          --accent: CanvasText;
          --ink: Canvas;
          --good: CanvasText;
          --danger: CanvasText;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        min-width: 0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      body:before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: none;
      }
      main {
        position: relative;
        width: min(1120px, 100%);
        margin: auto;
        padding: clamp(16px, 4vw, 44px);
      }
      .hero {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.4rem);
        line-height: 0.94;
        letter-spacing: -0.055em;
      }
      h2,
      h3 {
        margin: 0 0 0.75rem;
        line-height: 1.1;
      }
      p {
        color: var(--muted);
        margin: 0;
        max-width: 72ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1rem;
        align-items: start;
      }
      .card {
        grid-column: span 6;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: clamp(16px, 3vw, 26px);
        min-width: 0;
      }
      .wide {
        grid-column: 1/-1;
      }
      .third {
        grid-column: span 4;
      }
      .stack {
        display: grid;
        gap: 0.8rem;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      .split {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        border-radius: 0;
        border: 1px solid var(--line);
        background: var(--panel);
        max-width: 100%;
      }
      button {
        cursor: pointer;
        padding: 0.72rem 1rem;
        background: var(--panel2);
        font-weight: 760;
        touch-action: manipulation;
      }
      button.primary {
        background: var(--accent);
        color: var(--ink);
        border-color: transparent;
      }
      button.ghost {
        background: transparent;
      }
      button.danger {
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.72rem 0.85rem;
      }
      input[type='range'] {
        padding: 0.3rem;
      }
      textarea {
        min-height: 8rem;
        resize: vertical;
      }
      label {
        display: grid;
        gap: 0.35rem;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .metric {
        font-size: clamp(2.4rem, 11vw, 6rem);
        font-weight: 880;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.6rem;
        border-radius: 0;
        background: var(--panel2);
        color: var(--muted);
        font-size: 0.86rem;
        white-space: nowrap;
      }
      .muted {
        color: var(--muted);
      }
      .good {
        color: var(--good);
      }
      .danger-text {
        color: var(--danger);
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 0.65rem;
      }
      .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.85rem;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel);
        min-width: 0;
      }
      .item > span,
      .item > div {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      code {
        padding: 0.12rem 0.35rem;
        border-radius: 0;
        background: var(--panel2);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-width: 100%;
        overflow: auto;
      }
      svg {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .bar {
        transition:
          height 0.15s ease,
          y 0.15s ease;
      }
      .bars {
        display: flex;
        gap: 0.35rem;
        align-items: end;
        height: 8rem;
        padding: 0.6rem;
        border-radius: 0;
        background: var(--panel2);
      }
      .bars span {
        flex: 1;
        border-radius: 0;
        background: var(--accent);
        min-width: 0.4rem;
      }
      @media (max-width: 760px) {
        main {
          padding: 16px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .card,
        .wide,
        .third {
          grid-column: 1;
        }
        .row > button {
          flex: 1 1 9rem;
        }
        .metric {
          font-size: clamp(3rem, 24vw, 6rem);
        }
        .item {
          align-items: stretch;
          flex-direction: column;
        }
        .split {
          align-items: flex-start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <style data-flat-css>
      :root {
        --r: 0;
        --shadow: none;
        --sd: none;
        --bg: Canvas;
        --panel: Canvas;
        --panel2: Canvas;
        --pn: Canvas;
        --pn2: Canvas;
        --text: CanvasText;
        --fg: CanvasText;
        --muted: GrayText;
        --mut: GrayText;
        --line: color-mix(in srgb, CanvasText 20%, transparent);
        --ln: color-mix(in srgb, CanvasText 20%, transparent);
        --accent: CanvasText;
        --ac: CanvasText;
        --ink: Canvas;
        --good: CanvasText;
        --danger: CanvasText;
        --ok: CanvasText;
      }
      * {
        border-radius: 0;
        box-shadow: none;
      }
      body:before {
        background: none;
        content: none;
      }
      svg rect {
        rx: 0;
        ry: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <span class="pill">text/dumbact-tsx</span>
        <h1>Form validation</h1>
        <p>Validation is just data read during render. No hidden lifecycle gremlin.</p>
      </header>
      <div id="app" aria-live="polite"></div>
    </main>
    <script src="../dumbact.js"></script>
    <script type="text/dumbact-tsx">
      const S = Dumbact.scope('form')
      ;['name', 'email', 'message'].forEach(k => {
        if (!Dumbact.has(S.id(k))) S.set(k, '')
      })
      if (!Dumbact.has(S.id('sent'))) S.set('sent', false)
      function currentErrors() {
        const name = S.get('name', ''),
          email = S.get('email', ''),
          message = S.get('message', '')
        const out = []
        if (name.trim().length < 2) out.push('Name needs at least 2 characters')
        if (!/^\S+@\S+\.\S+$/.test(email)) out.push('Email must look real')
        if (message.trim().length < 12) out.push('Message needs at least 12 characters')
        return out
      }
      function fieldError(id, value) {
        if (id === 'name' && value.trim().length < 2) return 'Name required'
        if (id === 'email' && !/^\S+@\S+\.\S+$/.test(value)) return 'Email required'
        if (id === 'message' && value.trim().length < 12) return 'At least 12 chars'
        return ''
      }
      function Field(props) {
        const value = S.get(props.id, '')
        const bad = fieldError(props.id, value)
        const Tag = props.long ? 'textarea' : 'input'
        return <label>
          {props.label}
          <Tag
            id={props.id}
            value={value}
            onInput={event => {
              S.set(props.id, event.target.value)
              S.set('sent', false)
            }}
          />
          {bad ? <span class='danger-text'>{bad}</span> : <span class='good'>Looks usable</span>}
        </label>
      }
      function App() {
        const errors = currentErrors(),
          valid = !errors.length,
          sent = S.get('sent', false)
        return <section class='grid' data-ready='05-form'>
          <form
            class='card stack'
            novalidate
            onSubmit={event => {
              event.preventDefault()
              if (!currentErrors().length) S.set('sent', true)
            }}>
            <h2>Live form</h2>
            <Field id='name' label='Name' />
            <Field id='email' label='Email' />
            <Field id='message' label='Message' long />
            <button class='primary' data-testid='send' disabled={!valid}>
              Send
            </button>
            {sent ? (
              <p class='good' data-testid='sent'>
                Sent. No lifecycle gremlin appeared.
              </p>
            ) : null}
          </form>
          <aside class='card stack'>
            <h2>Snapshot</h2>
            <pre data-testid='snapshot'>{JSON.stringify(Dumbact.snapshot(), null, 2)}</pre>
          </aside>
        </section>
      }
      Dumbact.render(App, '#app')
      document.documentElement.dataset.demoReady = '05'
    </script>
  </body>
</html>
