<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CDN HTML libraries</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root{color-scheme:light dark;--bg:#f7f7fb;--fg:#151923;--mut:#596273;--pn:#fff;--pn2:#edf0f7;--ln:#d9deea;--ac:#365cff;--ink:#fff;--ok:#087c61;--sd:0 16px 42px rgba(18,24,38,.10);--r:22px}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--fg:#eef2ff;--mut:#aab4c7;--pn:#171b24;--pn2:#222938;--ln:#31394b;--ac:#91a5ff;--ink:#11141c;--ok:#5fe0b7;--sd:0 18px 52px rgba(0,0,0,.32)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}.pg{width:min(1080px,100%);margin:auto;padding:clamp(16px,4vw,44px)}.hd{display:grid;gap:.5rem;margin-bottom:1rem}.gd{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}.c{grid-column:span 6;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sd);padding:clamp(16px,3vw,26px);min-width:0}.w{grid-column:1/-1}.stk{display:grid;gap:.8rem}.rw{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.sp{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}.bd{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .6rem;border-radius:999px;background:var(--pn2);color:var(--mut);font-size:.86rem;white-space:nowrap}.mut{color:var(--mut)}.ok{color:var(--ok)}.big{font-size:clamp(2.6rem,11vw,6rem);font-weight:880;letter-spacing:-.06em;line-height:.9}.bt{touch-action:manipulation}.ls{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}.it{display:flex;justify-content:space-between;gap:.75rem;border:1px solid var(--ln);border-radius:16px;background:var(--pn);padding:.85rem;min-width:0}.it>*{min-width:0;overflow-wrap:anywhere}h1{margin:0;font-size:clamp(2rem,7vw,4.2rem);line-height:.94;letter-spacing:-.055em}h2{margin:0 0 .75rem;line-height:1.1}p{margin:0;max-width:72ch;color:var(--mut)}button{font:inherit}.btn-primary{--bs-btn-bg:var(--ac);--bs-btn-border-color:var(--ac);--bs-btn-color:var(--ink)}code{padding:.12rem .35rem;border-radius:.45rem;background:var(--pn2)}@media(max-width:760px){.pg{padding:16px}.gd{grid-template-columns:1fr}.c,.w{grid-column:1}.rw>.btn,.rw>button{flex:1 1 9rem}.it{flex-direction:column}.sp{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="pg">
    <header class="hd">
      <span class="bd">Bootstrap CSS CDN · Lodash script CDN</span>
      <h1>HTML library compatibility</h1>
      <p>Plain CDN links and script tags stay plain. Dumbact owns only state reads, render, and DOM patching.</p>
    </header>
    <div id="app" aria-live="polite"></div>
  </main>
  <script src="../dumbact.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  <script type="text/dumbact-jsx">
    const lib = globalThis._ || (globalThis._ = {
      countBy(xs, fn){const out={};for(const x of xs){const k=String(fn(x));out[k]=(out[k]||0)+1}return out},
      sortBy(xs, fn){return xs.slice().sort((a,b)=>String(fn(a)).localeCompare(String(fn(b))))},
      sumBy(xs, fn){return xs.reduce((n,x)=>n+Number(fn(x)||0),0)}
    });
    const S = Dumbact.scope('cdnhtml');
    const rows = [
      {id:'css',name:'Static CSS',kind:'style',pts:5},
      {id:'bs',name:'Bootstrap CDN',kind:'style',pts:3},
      {id:'ld',name:'Lodash script tag',kind:'data',pts:4},
      {id:'ids',name:'Id-addressed cells',kind:'data',pts:6},
      {id:'dom',name:'Inspectable DOM',kind:'runtime',pts:5},
      {id:'old',name:'Buildless page',kind:'runtime',pts:4}
    ];
    if(!Dumbact.has(S.id('kind'))) S.set('kind','all');
    function App(){
      const kind=S.get('kind','all');
      const filtered=kind==='all'?rows:rows.filter(x=>x.kind===kind);
      const sorted=lib.sortBy(filtered,x=>x.name);
      const counts=lib.countBy(rows,x=>x.kind);
      const total=lib.sumBy(filtered,x=>x.pts);
      const source=lib.VERSION?('lodash '+lib.VERSION):(lib.__name||'local fallback');
      return <section class="gd" data-ready="12-cdn">
        <article class="c stk">
          <div class="sp"><h2>Data first</h2><span class="bd" data-testid="cdn-lib">{source}</span></div>
          <div class="big" data-testid="cdn-total">{total}</div>
          <p>Bootstrap classes such as <code>btn</code> and <code>container</code> can coexist with short local classes such as <code>pg</code>, <code>gd</code>, <code>c</code>, and <code>rw</code>.</p>
          <div class="rw" role="group" aria-label="kind filter">
            {['all','style','data','runtime'].map(k=><button class={k===kind?'btn btn-primary bt':'btn btn-outline-secondary bt'} key={k} onClick={()=>S.set('kind',k)}>{k}</button>)}
          </div>
        </article>
        <aside class="c stk">
          <h2>Rows</h2>
          <ul class="ls" data-testid="cdn-rows">{sorted.map(x=><li class="it" key={x.id}><span>{x.name}</span><span class="bd">{x.kind} · {x.pts}</span></li>)}</ul>
          <p class="mut">Kinds: style {counts.style}, data {counts.data}, runtime {counts.runtime}.</p>
        </aside>
      </section>
    }
    Dumbact.render(App,'#app');
    document.documentElement.dataset.demoReady='12';
  </script>
</body>
</html>
