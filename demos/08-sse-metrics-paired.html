<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Paired SSE metrics</title><style>:root{color-scheme:light dark;--bg:Canvas;--panel:Canvas;--panel2:Canvas;--text:CanvasText;--muted:GrayText;--line:color-mix(in srgb,CanvasText 20%,transparent);--accent:CanvasText;--ink:Canvas;--good:CanvasText;--danger:CanvasText;--shadow:none;--r:0}
@media (prefers-color-scheme:dark){:root{--bg:Canvas;--panel:Canvas;--panel2:Canvas;--text:CanvasText;--muted:GrayText;--line:color-mix(in srgb,CanvasText 20%,transparent);--accent:CanvasText;--ink:Canvas;--good:CanvasText;--danger:CanvasText;--shadow:none}}
*{box-sizing:border-box}html{min-width:0}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:none}main{position:relative;width:min(1120px,100%);margin:auto;padding:clamp(16px,4vw,44px)}.hero{display:grid;gap:.5rem;margin-bottom:1rem}h1{margin:0;font-size:clamp(2rem,7vw,4.4rem);line-height:.94;letter-spacing:-.055em}h2,h3{margin:0 0 .75rem;line-height:1.1}p{color:var(--muted);margin:0;max-width:72ch}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;align-items:start}.card{grid-column:span 6;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,3vw,26px);min-width:0}.wide{grid-column:1/-1}.third{grid-column:span 4}.stack{display:grid;gap:.8rem}.row{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.split{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}button,input,select,textarea{font:inherit;color:inherit;border-radius:0;border:1px solid var(--line);background:var(--panel);max-width:100%}button{cursor:pointer;padding:.72rem 1rem;background:var(--panel2);font-weight:760;touch-action:manipulation}button.primary{background:var(--accent);color:var(--ink);border-color:transparent}button.ghost{background:transparent}button.danger{color:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}input,select,textarea{width:100%;padding:.72rem .85rem}input[type=range]{padding:.3rem}textarea{min-height:8rem;resize:vertical}label{display:grid;gap:.35rem;color:var(--muted);font-size:.92rem}.metric{font-size:clamp(2.4rem,11vw,6rem);font-weight:880;letter-spacing:-.06em;line-height:.9}.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .6rem;border-radius:0;background:var(--panel2);color:var(--muted);font-size:.86rem;white-space:nowrap}.muted{color:var(--muted)}.good{color:var(--good)}.danger-text{color:var(--danger)}.list{list-style:none;padding:0;margin:0;display:grid;gap:.65rem}.item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.85rem;border:1px solid var(--line);border-radius:0;background:var(--panel);min-width:0}.item>span,.item>div{min-width:0;overflow-wrap:anywhere}code{padding:.12rem .35rem;border-radius:0;background:var(--panel2)}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow:auto}svg{max-width:100%;height:auto;display:block}.bar{transition:height .15s ease,y .15s ease}.bars{display:flex;gap:.35rem;align-items:end;height:8rem;padding:.6rem;border-radius:0;background:var(--panel2)}.bars span{flex:1;border-radius:0;background:var(--accent);min-width:.4rem}@media(max-width:760px){main{padding:16px}.grid{grid-template-columns:1fr}.card,.wide,.third{grid-column:1}.row>button{flex:1 1 9rem}.metric{font-size:clamp(3rem,24vw,6rem)}.item{align-items:stretch;flex-direction:column}.split{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}</style><style data-flat-css>:root{--r:0;--shadow:none;--sd:none;--bg:Canvas;--panel:Canvas;--panel2:Canvas;--pn:Canvas;--pn2:Canvas;--text:CanvasText;--fg:CanvasText;--muted:GrayText;--mut:GrayText;--line:color-mix(in srgb,CanvasText 20%,transparent);--ln:color-mix(in srgb,CanvasText 20%,transparent);--accent:CanvasText;--ac:CanvasText;--ink:Canvas;--good:CanvasText;--danger:CanvasText;--ok:CanvasText}*{border-radius:0;box-shadow:none}body:before{background:none;content:none}svg rect{rx:0;ry:0}</style></head><body><main><header class="hero"><span class="pill">text/dumbact-tsx</span><h1>Paired SSE metrics</h1><p>Server-sent events write state cells. The UI does not know about streams.</p></header><div id="app" aria-live="polite"></div></main><script src="../dumbact.js"></script><script type="text/dumbact-tsx">
const METRICS="sse:metrics",STATUS="sse:status";if(!Dumbact.has(METRICS))Dumbact.set(METRICS,{count:0,cpu:0,mem:0,history:[]});if(!Dumbact.has(STATUS))Dumbact.set(STATUS,"idle");let source=null;
function connect(){if(source)source.close();Dumbact.set(STATUS,"connecting");source=new EventSource("/events");source.onopen=()=>Dumbact.set(STATUS,"connected");source.onerror=()=>Dumbact.set(STATUS,"reconnecting");source.addEventListener("metric",event=>{const data=JSON.parse(event.data);Dumbact.set(METRICS,prev=>Object.assign({},data,{history:(prev&&prev.history||[]).concat(data).slice(-24)}))})}
function pause(){if(source)source.close();source=null;Dumbact.set(STATUS,"paused")}
function App(){const m=Dumbact.get(METRICS),status=Dumbact.get(STATUS),hist=m.history||[],max=Math.max.apply(null,hist.map(x=>x.cpu).concat(1));return <section class="grid" data-ready="08-sse"><article class="card stack"><div class="split"><h2>Server-sent metrics</h2><span class="pill" data-testid="sse-status">{status}</span></div><div class="metric" data-testid="sse-count">{m.count}</div><p>EventSource writes ids. The view just reads them.</p><div class="row"><button class="primary" onClick={connect}>Connect</button><button onClick={pause}>Pause</button></div></article><aside class="card stack"><h2>History</h2><p>CPU-ish {m.cpu}% · Memory-ish {m.mem}%</p><svg viewBox="0 0 320 150">{hist.map((point,i)=>{const w=320/Math.max(1,hist.length),hh=Math.max(2,(point.cpu/max)*126);return <rect key={point.count} x={i*w} y={140-hh} width={Math.max(2,w-2)} height={hh} rx="0" fill="currentColor" opacity="0.8" />})}</svg></aside></section>}
connect();Dumbact.render(App,"#app");document.documentElement.dataset.demoReady="08";window.addEventListener("beforeunload",pause);

</script></body></html>
