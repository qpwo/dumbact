<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Paired REST notes</title><style>:root{color-scheme:light dark;--bg:#f7f7fb;--panel:#fff;--panel2:#edf0f7;--text:#151923;--muted:#596273;--line:#d9deea;--accent:#365cff;--ink:#fff;--good:#087c61;--danger:#b3261e;--shadow:0 16px 42px rgba(18,24,38,.10);--r:22px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#171b24;--panel2:#222938;--text:#eef2ff;--muted:#aab4c7;--line:#31394b;--accent:#91a5ff;--ink:#11141c;--good:#5fe0b7;--danger:#ff9f96;--shadow:0 18px 52px rgba(0,0,0,.32)}}
*{box-sizing:border-box}html{min-width:0}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 0%,rgba(54,92,255,.16),transparent 28rem),radial-gradient(circle at 90% 10%,rgba(8,124,97,.12),transparent 24rem)}main{position:relative;width:min(1120px,100%);margin:auto;padding:clamp(16px,4vw,44px)}.hero{display:grid;gap:.5rem;margin-bottom:1rem}h1{margin:0;font-size:clamp(2rem,7vw,4.4rem);line-height:.94;letter-spacing:-.055em}h2,h3{margin:0 0 .75rem;line-height:1.1}p{color:var(--muted);margin:0;max-width:72ch}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;align-items:start}.card{grid-column:span 6;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,3vw,26px);min-width:0}.wide{grid-column:1/-1}.third{grid-column:span 4}.stack{display:grid;gap:.8rem}.row{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.split{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}button,input,select,textarea{font:inherit;color:inherit;border-radius:14px;border:1px solid var(--line);background:var(--panel);max-width:100%}button{cursor:pointer;padding:.72rem 1rem;background:var(--panel2);font-weight:760;touch-action:manipulation}button.primary{background:var(--accent);color:var(--ink);border-color:transparent}button.ghost{background:transparent}button.danger{color:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}input,select,textarea{width:100%;padding:.72rem .85rem}input[type=range]{padding:.3rem}textarea{min-height:8rem;resize:vertical}label{display:grid;gap:.35rem;color:var(--muted);font-size:.92rem}.metric{font-size:clamp(2.4rem,11vw,6rem);font-weight:880;letter-spacing:-.06em;line-height:.9}.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .6rem;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:.86rem;white-space:nowrap}.muted{color:var(--muted)}.good{color:var(--good)}.danger-text{color:var(--danger)}.list{list-style:none;padding:0;margin:0;display:grid;gap:.65rem}.item{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.85rem;border:1px solid var(--line);border-radius:16px;background:var(--panel);min-width:0}.item>span,.item>div{min-width:0;overflow-wrap:anywhere}code{padding:.12rem .35rem;border-radius:.45rem;background:var(--panel2)}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;overflow:auto}svg{max-width:100%;height:auto;display:block}.bar{transition:height .15s ease,y .15s ease}.bars{display:flex;gap:.35rem;align-items:end;height:8rem;padding:.6rem;border-radius:18px;background:var(--panel2)}.bars span{flex:1;border-radius:999px 999px 0 0;background:var(--accent);min-width:.4rem}@media(max-width:760px){main{padding:16px}.grid{grid-template-columns:1fr}.card,.wide,.third{grid-column:1}.row>button{flex:1 1 9rem}.metric{font-size:clamp(3rem,24vw,6rem)}.item{align-items:stretch;flex-direction:column}.split{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}</style></head><body><main><header class="hero"><span class="pill">text/dumbact-tsx</span><h1>Paired REST notes</h1><p>A normal Express server, a normal HTML file, and explicit async writes.</p></header><div id="app" aria-live="polite"></div></main><script src="../dumbact.js"></script><script type="text/dumbact-tsx">
const TEXT="notes:text",NOTES="notes:list";function box(data,loading,error){return{data:data||[],loading:!!loading,error:error||null}}
if(!Dumbact.has(TEXT))Dumbact.set(TEXT,"");if(!Dumbact.has(NOTES))Dumbact.set(NOTES,box([]));
function load(){const old=Dumbact.peek(NOTES,box([]));Dumbact.set(NOTES,box(old.data,true));return fetch("/api/notes").then(r=>r.json()).then(data=>Dumbact.set(NOTES,box(data))).catch(error=>Dumbact.set(NOTES,box(old.data,false,error)))}
function add(event){event.preventDefault();const text=Dumbact.peek(TEXT,"").trim();if(!text)return;fetch("/api/notes",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text})}).then(()=>{Dumbact.set(TEXT,"");return load()})}
function remove(id){fetch("/api/notes/"+encodeURIComponent(id),{method:"DELETE"}).then(load)}
function App(){const text=Dumbact.get(TEXT,""),res=Dumbact.get(NOTES,box([])),notes=res.data||[];return <section class="grid" data-ready="07-notes"><article class="card stack wide"><div class="split"><div><h2>Express notes API</h2><p>Paired HTML plus REST server.</p></div><span class="pill" data-testid="note-count">{res.loading?"loading":notes.length+" notes"}</span></div><form class="row" onSubmit={add}><label style={{flex:"1 1 20rem"}}>Note<input data-testid="note-input" value={text} onInput={event=>Dumbact.set(TEXT,event.target.value)} placeholder="write a note" /></label><button class="primary" data-testid="note-add" disabled={!text.trim()}>Add</button><button type="button" onClick={load}>Reload</button></form>{res.error?<p class="danger-text">{String(res.error.message||res.error)}</p>:null}<ul class="list" data-testid="notes">{notes.map(note=><li class="item" key={note.id}><span>{note.text}</span><button class="danger" onClick={()=>remove(note.id)}>Delete</button></li>)}</ul></article></section>}
load();Dumbact.render(App,"#app");document.documentElement.dataset.demoReady="07";
</script></body></html>
