<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Module graph without bundlers</title><style>:root{color-scheme:light dark;--bg:#f7f7fb;--panel:#fff;--panel2:#edf0f7;--text:#151923;--muted:#596273;--line:#d9deea;--accent:#365cff;--ink:#fff;--shadow:0 16px 42px rgba(18,24,38,.10);--r:22px}@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--panel:#171b24;--panel2:#222938;--text:#eef2ff;--muted:#aab4c7;--line:#31394b;--accent:#91a5ff;--ink:#11141c;--shadow:0 18px 52px rgba(0,0,0,.32)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}main{width:min(920px,100%);margin:auto;padding:clamp(16px,4vw,44px)}h1{margin:0;font-size:clamp(2rem,7vw,4.1rem);line-height:.94;letter-spacing:-.055em}p{color:var(--muted);margin:0;max-width:72ch}.hero{display:grid;gap:.5rem;margin-bottom:1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,3vw,26px)}.stack{display:grid;gap:.8rem}.row{display:flex;gap:.65rem;flex-wrap:wrap;align-items:center}.pill{display:inline-flex;padding:.35rem .6rem;border-radius:999px;background:var(--panel2);color:var(--muted);font-size:.86rem;white-space:nowrap}button{font:inherit;cursor:pointer;padding:.72rem 1rem;border-radius:14px;border:1px solid transparent;background:var(--accent);color:var(--ink);font-weight:760;touch-action:manipulation}.metric{font-size:clamp(2.4rem,11vw,6rem);font-weight:880;letter-spacing:-.06em;line-height:.9}code{padding:.12rem .35rem;border-radius:.45rem;background:var(--panel2)}@media(max-width:760px){main{padding:16px}.row>button{flex:1 1 9rem}.metric{font-size:clamp(3rem,24vw,6rem)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}</style></head><body><main><header class="hero"><span class="pill">text/dumbact-tsx-module</span><h1>Module graph without bundlers</h1><p>Native module syntax. Relative TS/JSX files are fetched, stripped, lowered and served to the browser as real ES modules.</p></header><div id="app"></div></main><script src="../dumbact.js"></script><script type="text/dumbact-tsx-module" src="./modules/main.tsx"></script></body></html>
