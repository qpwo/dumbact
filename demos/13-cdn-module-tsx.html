<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TSX module with CDN import</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f7fb;--fg:#151923;--mut:#596273;--pn:#fff;--pn2:#edf0f7;--ln:#d9deea;--ac:#365cff;--ink:#fff;--sd:0 16px 42px rgba(18,24,38,.10);--r:22px}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--fg:#eef2ff;--mut:#aab4c7;--pn:#171b24;--pn2:#222938;--ln:#31394b;--ac:#91a5ff;--ink:#11141c;--sd:0 18px 52px rgba(0,0,0,.32)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}main{width:min(960px,100%);margin:auto;padding:clamp(16px,4vw,44px)}.hd{display:grid;gap:.5rem;margin-bottom:1rem}.gd{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}.c{grid-column:span 6;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sd);padding:clamp(16px,3vw,26px);min-width:0}.stk{display:grid;gap:.8rem}.rw{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}.bd{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .6rem;border-radius:999px;background:var(--pn2);color:var(--mut);font-size:.86rem;white-space:nowrap}.big{font-size:clamp(2.6rem,11vw,6rem);font-weight:880;letter-spacing:-.06em;line-height:.9}.ls{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}.it{border:1px solid var(--ln);border-radius:16px;background:var(--pn);padding:.85rem;min-width:0;overflow-wrap:anywhere}button{font:inherit;cursor:pointer;padding:.72rem 1rem;border-radius:14px;border:1px solid transparent;background:var(--ac);color:var(--ink);font-weight:760;touch-action:manipulation}h1{margin:0;font-size:clamp(2rem,7vw,4.2rem);line-height:.94;letter-spacing:-.055em}h2{margin:0 0 .75rem;line-height:1.1}p{margin:0;max-width:72ch;color:var(--mut)}code{padding:.12rem .35rem;border-radius:.45rem;background:var(--pn2)}@media(max-width:760px){main{padding:16px}.gd{grid-template-columns:1fr}.c{grid-column:1}.rw>button{flex:1 1 9rem}.big{font-size:clamp(3rem,24vw,6rem)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <header class="hd">
      <span class="bd">text/dumbact-tsx-module · external CDN module</span>
      <h1>TSX modules plus CDN import</h1>
      <p>A TSX module can import local TS/TSX files, the built-in <code>dumbact</code> module, and a full CDN URL.</p>
    </header>
    <div id="app"></div>
  </main>
  <script src="../dumbact.js"></script>
  <script type="text/dumbact-tsx-module" src="./modules/cdn-main.tsx"></script>
</body>
</html>
