<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>TSX module with CDN import</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --fg: CanvasText;
        --mut: GrayText;
        --pn: Canvas;
        --pn2: Canvas;
        --ln: color-mix(in srgb, CanvasText 20%, transparent);
        --ac: CanvasText;
        --ink: Canvas;
        --sd: none;
        --r: 0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: Canvas;
          --fg: CanvasText;
          --mut: GrayText;
          --pn: Canvas;
          --pn2: Canvas;
          --ln: color-mix(in srgb, CanvasText 20%, transparent);
          --ac: CanvasText;
          --ink: Canvas;
          --sd: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      main {
        width: min(960px, 100%);
        margin: auto;
        padding: clamp(16px, 4vw, 44px);
      }
      .hd {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .gd {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 1rem;
      }
      .c {
        grid-column: span 6;
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: var(--r);
        box-shadow: var(--sd);
        padding: clamp(16px, 3vw, 26px);
        min-width: 0;
      }
      .stk {
        display: grid;
        gap: 0.8rem;
      }
      .rw {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      .bd {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.6rem;
        border-radius: 0;
        background: var(--pn2);
        color: var(--mut);
        font-size: 0.86rem;
        white-space: nowrap;
      }
      .big {
        font-size: clamp(2.6rem, 11vw, 6rem);
        font-weight: 880;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }
      .ls {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.65rem;
      }
      .it {
        border: 1px solid var(--ln);
        border-radius: 0;
        background: var(--pn);
        padding: 0.85rem;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        cursor: pointer;
        padding: 0.72rem 1rem;
        border-radius: 0;
        border: 1px solid transparent;
        background: var(--ac);
        color: var(--ink);
        font-weight: 760;
        touch-action: manipulation;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.2rem);
        line-height: 0.94;
        letter-spacing: -0.055em;
      }
      h2 {
        margin: 0 0 0.75rem;
        line-height: 1.1;
      }
      p {
        margin: 0;
        max-width: 72ch;
        color: var(--mut);
      }
      code {
        padding: 0.12rem 0.35rem;
        border-radius: 0;
        background: var(--pn2);
      }
      @media (max-width: 760px) {
        main {
          padding: 16px;
        }
        .gd {
          grid-template-columns: 1fr;
        }
        .c {
          grid-column: 1;
        }
        .rw > button {
          flex: 1 1 9rem;
        }
        .big {
          font-size: clamp(3rem, 24vw, 6rem);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

    <style data-flat-css>
      :root {
        --r: 0;
        --shadow: none;
        --sd: none;
        --bg: Canvas;
        --panel: Canvas;
        --panel2: Canvas;
        --pn: Canvas;
        --pn2: Canvas;
        --text: CanvasText;
        --fg: CanvasText;
        --muted: GrayText;
        --mut: GrayText;
        --line: color-mix(in srgb, CanvasText 20%, transparent);
        --ln: color-mix(in srgb, CanvasText 20%, transparent);
        --accent: CanvasText;
        --ac: CanvasText;
        --ink: Canvas;
        --good: CanvasText;
        --danger: CanvasText;
        --ok: CanvasText;
      }
      * {
        border-radius: 0;
        box-shadow: none;
      }
      body:before {
        background: none;
        content: none;
      }
      svg rect {
        rx: 0;
        ry: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hd">
        <span class="bd">text/dumbact-tsx-module · external CDN module</span>
        <h1>TSX modules plus CDN import</h1>
        <p>
          A TSX module can import local TS/TSX files, the built-in
          <code>dumbact</code> module, and a full CDN URL.
        </p>
      </header>
      <div id="app"></div>
    </main>
    <script src="../dumbact.js"></script>
    <script type="text/dumbact-tsx-module" src="./modules/cdn-main.tsx"></script>
  </body>
</html>
