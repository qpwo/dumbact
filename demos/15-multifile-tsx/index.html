<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Multi-file TSX service queue</title>
  <style>
    :root{color-scheme:light dark;--bg:Canvas;--fg:CanvasText;--mut:GrayText;--pn:Canvas;--ln:color-mix(in srgb,CanvasText 24%,transparent);--ac:CanvasText}
    @media (prefers-color-scheme:dark){:root{--bg:Canvas;--fg:CanvasText;--mut:GrayText;--pn:Canvas;--ln:color-mix(in srgb,CanvasText 24%,transparent);--ac:CanvasText}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}button,input{font:inherit;border:1px solid var(--ln);border-radius:0;background:ButtonFace;color:ButtonText;padding:.65rem .8rem}button{cursor:pointer}input{width:100%;background:Field;color:FieldText}.pg{width:min(980px,100%);margin:auto;padding:clamp(16px,4vw,40px)}.hd{display:grid;gap:.35rem;margin-bottom:1rem}.bd{border:1px solid var(--ln);padding:.18rem .45rem;width:max-content;color:var(--mut);font-size:.82rem}.gd{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}.c{grid-column:span 6;border:1px solid var(--ln);background:var(--pn);padding:1rem}.wide{grid-column:span 12}.stk{display:grid;gap:.85rem}.rw{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}.sp{display:flex;justify-content:space-between;gap:1rem;align-items:start}.big{font-size:clamp(2rem,9vw,4rem);font-weight:800;line-height:1}.ls{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}.it{border:1px solid var(--ln);padding:.75rem;display:grid;grid-template-columns:1fr auto;gap:1rem}.mut{color:var(--mut)}.tag{border:1px solid var(--ln);padding:.12rem .4rem}.done{color:var(--mut)}@media (max-width:760px){.gd{grid-template-columns:1fr}.c,.wide{grid-column:auto}.it,.sp,.rw{display:grid;grid-template-columns:1fr}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none;animation:none}}
  </style>
</head>
<body>
  <main class="pg">
    <header class="hd">
      <span class="bd">text/dumbact-tsx-module in a folder</span>
      <h1>Bike shop service queue</h1>
      <p class="mut">A small multi-file TSX app for triaging repair jobs with typed state helpers.</p>
    </header>
    <div id="app"></div>
  </main>
  <script src="/dumbact.js"></script>
  <script type="text/dumbact-tsx-module" src="./app.tsx"></script>
</body>
</html>
